name: Validate experiment pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  validate:
    name: Validate group scope and experiment files
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate branch scope and required files
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail

          if [[ ! "$HEAD_BRANCH" =~ ^group-[a-z0-9-]+$ ]]; then
            echo "Pull requests to main must come from a group-* branch."
            exit 1
          fi

          group="${HEAD_BRANCH#group-}"
          allowed="experiments/$group/"