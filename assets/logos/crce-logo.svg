    <text x="0" y="36" font-family="'Open Sans', sans-serif" font-weight="500" font-size="8.5" fill="#555555">College of Engineering, Mumbai</text>
    <text x="0" y="47" font-family="'Open Sans', sans-serif" font-weight="400" font-size="7.5" fill="#ff6600">Department of Computer Engineering</text>
